name: Supabase

# Applies new database migrations (supabase/migrations, then the school's own
# supabase/schools/<id>/) to each school's live project and redeploys the Edge Functions
# on every push to main that changes them. Each school has its own Supabase project (its
# schools/<id>/app.json), so no data is shared.
# One-time setup: Settings → Secrets and variables → Actions → New repository secret,
# a personal access token (supabase.com → Account → Access Tokens) from the account that
# owns each school's project: SUPABASE_ACCESS_TOKEN for Kingdom Heights,
# SUPABASE_ACCESS_TOKEN_WCA for Westminster.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/schools/**'
      - 'schools/*/app.json'
      - 'supabase/functions/**'
      - 'scripts/supabase_setup.mjs'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

# One deploy at a time, never cancelled halfway through a migration.
concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy functions (${{ matrix.school }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - school: khroyals
            token: SUPABASE_ACCESS_TOKEN
            required: true
          # Skipped with a warning until its secret is added.
          - school: wca
            token: SUPABASE_ACCESS_TOKEN_WCA
            required: false
    env:
      SCHOOL: ${{ matrix.school }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same checks as the APK build: a migration that fails the DB tests never reaches the live project.
      - run: npm run typecheck
      - run: npm test
      - name: Apply migrations and deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets[matrix.token] }}
          TOKEN_NAME: ${{ matrix.token }}
          REQUIRED: ${{ matrix.required }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            if [ "$REQUIRED" != "true" ]; then
              echo "::warning::$SCHOOL wasn't deployed: add the $TOKEN_NAME repository secret (see the top of .github/workflows/supabase.yml)."
              exit 0
            fi
            echo "::error::Add the $TOKEN_NAME repository secret (see the top of .github/workflows/supabase.yml)."
            exit 1
          fi
          node scripts/supabase_setup.mjs --deploy
