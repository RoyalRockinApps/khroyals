name: Web app (GitHub Pages)

# Publishes the web version of each school's app (site content, its community and the
# admin portal): Kingdom Heights at https://<owner>.github.io/khroyals/ and every other
# school under it, at /khroyals/<school>/ (schools/<id>/app.json → experiments.baseUrl).
# One-time setup: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web --output-dir dist
        env:
          CI: 1
          SCHOOL: khroyals
      - run: npx expo export --platform web --output-dir dist/wca
        env:
          CI: 1
          SCHOOL: wca
      # Deep links (e.g. /khroyals/page/admissions) fall back to the app shell; GitHub Pages
      # has one 404 page, so it sends /khroyals/wca/… to WCA's app and the rest to Kingdom Heights'.
      - run: node scripts/pages_404.mjs dist && touch dist/.nojekyll
      # The demo overview (features and running costs): on the site, not linked from the app.
      - run: cp -r overview dist/overview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
