name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

# Deleting the older APKs (below) needs to write Actions artifacts.
permissions:
  contents: read
  actions: write

jobs:
  test:
    name: Type-check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build-apk:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner image ships the Android SDK (ANDROID_HOME is preset).
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/khroyals-${GITHUB_SHA::7}.apk"

      # Only builds of main keep an APK, and only the newest successful one: once this one is
      # uploaded, every older APK is deleted. Pull request builds just prove it compiles.
      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: khroyals-android-apk
          path: out/*.apk
          retention-days: 90

      - name: Delete older APKs
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const old = (await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, name: 'khroyals-android-apk', per_page: 100 }))
              .filter((a) => a.workflow_run?.id !== context.runId);
            for (const a of old) await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
            core.info(`Deleted ${old.length} older APK${old.length === 1 ? '' : 's'}.`);
